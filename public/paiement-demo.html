<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement du dépôt · Jace Savard Studio Nord</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><meta name="theme-color" content="#000000"><link rel="stylesheet" href="/style.css"></head><body>
<header><img class="cover" src="/cover-banner.jpg" alt="Studio Nord — 331 rue Richard, Joliette"><a class="brand" href="/"><img src="/logo.jpg" alt="Logo Studio Nord"><div><div class="nm">Jace Savard Studio Nord</div><small>331 rue Richard, Joliette</small></div></a><h1>Paiement du dépôt</h1><p>Simulation — mode démo</p></header><main>
<div class="demo">⚠️ <b>Mode démo</b> : ceci remplace Stripe Checkout tant que les clés Stripe ne sont pas configurées. Aucune carte n'est débitée.</div>
<div class="card"><div class="sum" id="sum">Chargement…</div><label>Numéro de carte (factice)</label><input value="4242 4242 4242 4242" disabled>
</div><div class="player"><div class="in"><div class="info"><b>Dépôt</b><small id="pd">Paiement simulé</small></div><button id="pay">Payer (simulation)</button></div></div></main>
<script>const id=new URLSearchParams(location.search).get('id');
fetch('/api/bookings/'+id).then(r=>r.json()).then(b=>{document.getElementById('sum').innerHTML=`<b>${b.service}</b><br>${b.when}<br>Dépôt : <b>${b.deposit},00 $</b>`;document.getElementById('pd').textContent=b.deposit+',00 $ · simulation'});
document.getElementById('pay').onclick=async()=>{await fetch('/api/demo-pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});location='/confirmation.html?id='+id};</script></body></html>
