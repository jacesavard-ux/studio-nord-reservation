<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmation · Jace Savard Studio Nord</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><meta name="theme-color" content="#000000"><link rel="stylesheet" href="/style.css"></head><body>
<header><img class="cover" src="/cover-banner.jpg" alt="Studio Nord — 331 rue Richard, Joliette"><a class="brand" href="/"><img src="/logo.jpg" alt="Logo Studio Nord"><div><div class="nm">Jace Savard Studio Nord</div><small>331 rue Richard, Joliette</small></div></a><h1>Merci!</h1><p>Votre rendez-vous</p></header><main><div class="card" id="c">Chargement…</div></main>
<script>const id=new URLSearchParams(location.search).get('id');fetch('/api/bookings/'+id).then(r=>r.json()).then(b=>{
document.getElementById('c').innerHTML=b.status==='confirmed'?`<h2 class="ok">✅ Rendez-vous confirmé</h2><div class="sum"><b>${b.service}</b><br>${b.when}<br>Nom : ${b.name}<br>Prix : ${b.priceNote} (plus taxes)<br>Dépôt payé : <b>${b.deposit},00 $</b>${b.tipCents?`<br>Pourboire : <b>${(b.tipCents/100).toFixed(2).replace('.',',')} $</b> — merci! 💛`:''}${b.demo?' <i>(simulation)</i>':''}<br>Le solde est payable au salon.<br>📍 331 rue Richard, Joliette</div>
<p class="policy">${b.deposit>=40?'<b>Rappel :</b> le dépôt de 40 $ est non remboursable si vous ne vous présentez pas et n\'avisez pas au moins 72 h à l\'avance.':'Pour annuler ou modifier, merci de nous aviser le plus tôt possible.'}</p><p class="policy">Merci de faire confiance à <b>Jace Savard Studio Nord</b>.</p><a href="/">← Prendre un autre rendez-vous</a>`
:b.status==='interac'?`<h2 class="pend">⏳ En attente de paiement</h2><div class="sum"><b>${b.service}</b><br>${b.when}<br>Nom : ${b.name}<br>Numéro de réservation : <b>${b.ref}</b></div>
<h2>Envoyez votre dépôt par virement Interac</h2><ol class="policy"><li>Montant : <b>${(b.totalCents/100).toFixed(2).replace('.',',')} $</b>${b.tipCents?` (dépôt ${b.deposit},00 $ + pourboire ${(b.tipCents/100).toFixed(2).replace('.',',')} $)`:''}</li><li>Destinataire : <b>${b.interacEmail}</b></li><li>Dans le message du virement, inscrivez votre numéro de réservation : <b>${b.ref}</b></li></ol>
<p class="policy">Votre plage est retenue pendant <b>${b.holdHours} h</b> (jusqu'au ${b.expiresAt}). Votre rendez-vous sera confirmé dès la réception du virement. Sans virement reçu dans ce délai, la plage sera libérée automatiquement.</p>
<p class="policy">Le dépôt est déduit de votre facture; le solde est payable au salon. <b>Le dépôt est non remboursable sans un préavis d'au moins 72 h.</b></p><a href="/">← Retour</a>`
:b.status==='expired'?`<h2>Réservation expirée</h2><p>Le virement Interac n'a pas été reçu dans les délais et la plage a été libérée.</p><a href="/">Prendre un nouveau rendez-vous</a>`
:b.status==='cancelled'?`<h2>Réservation annulée</h2><a href="/">Retour</a>`
:`<h2>Paiement en attente</h2><p>Votre paiement n'a pas encore été confirmé.</p><a href="/">Retour</a>`})</script></body></html>
