<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Jace Savard Studio Nord</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><meta name="theme-color" content="#000000"><link rel="stylesheet" href="/style.css"></head><body>
<header><img class="cover" src="/cover-banner.jpg" alt="Studio Nord — 331 rue Richard, Joliette"><a class="brand" href="/"><img src="/logo.jpg" alt="Logo Studio Nord"><div><div class="nm">Jace Savard Studio Nord</div><small>331 rue Richard, Joliette</small></div></a><h1>Administration</h1><p>Rendez-vous à venir et plages bloquées</p></header><main>
<div class="card"><h2 class="pend">⏳ Virements Interac en attente</h2><div id="ia"></div></div>
<div class="card"><h2>Rendez-vous à venir</h2><div id="b"></div></div>
<div class="card"><h2>Bloquer une plage</h2><form id="f"><label>Date</label><input type="date" name="date" required><label>De</label><input type="time" name="from" step="1800" required><label>À</label><input type="time" name="to" step="1800" required><label>Raison</label><input name="reason" placeholder="Ex.: rendez-vous médical"><button>Bloquer</button></form><div id="bl" style="margin-top:12px"></div></div></main>
<script>async function load(){const d=await (await fetch('/api/admin/data')).json();
document.getElementById('ia').innerHTML=d.interac.map(b=>`<div class="svc"><div><b>${b.when}</b><small>N° <b>${b.ref}</b> — ${b.service} — ${b.name} · ${b.phone} · ${b.email}${b.note?'<br>📝 '+b.note:''}<br><span class="pend">Dépôt attendu : ${b.deposit} $ · retenu jusqu'au ${b.expires}</span></small></div><div class="btns"><button onclick="ok('${b.id}')">Confirmer paiement reçu</button><a href="#" onclick="cx('${b.id}')">Annuler</a></div></div>`).join('')||'<p class="muted">Aucun virement en attente.</p>';
document.getElementById('b').innerHTML=d.bookings.map(b=>`<div class="svc"><div><b>${b.when}</b><small>${b.service} — ${b.name} · ${b.phone} · ${b.email}${b.note?'<br>📝 '+b.note:''}<br>Dépôt ${b.deposit} $</small></div><a href="#" onclick="cx('${b.id}')">Annuler</a></div>`).join('')||'<p class="muted">Aucun.</p>';
document.getElementById('bl').innerHTML=d.blocks.map(b=>`<div class="svc"><div><b>${b.from}</b><small>jusqu'à ${b.to} ${b.reason}</small></div><a href="#" onclick="del(${b.id})">Retirer</a></div>`).join('')}
async function ok(id){if(confirm('Confirmer la réception du virement Interac?')){const r=await fetch('/api/admin/bookings/'+id+'/confirm',{method:'POST'});if(!r.ok)alert((await r.json()).error);load()}}
async function del(id){await fetch('/api/admin/blocks/'+id,{method:'DELETE'});load()}
async function cx(id){if(confirm('Annuler ce rendez-vous?')){await fetch('/api/admin/bookings/'+id+'/cancel',{method:'POST'});load()}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/blocks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok)alert((await r.json()).error);load()};load()</script></body></html>
